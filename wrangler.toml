name = "shapeit"
compatibility_date = "2026-03-29"
main = "src/worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "GAME_SERVICE"
class_name = "GameService"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameService"]
